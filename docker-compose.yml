version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: home_inventory_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: home_inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: home_inventory_backend
    restart: always
    ports:
      - "8000:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/home_inventory
      - PORT=8080
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
